[project]
name = "pitwall-os-api"
version = "0.1.0"
description = "Pitwall OS data and ML engineering core API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "mlflow>=2.17,<4.0",
  "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
